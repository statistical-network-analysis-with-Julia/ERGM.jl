name = "offset_ergm"

[provenance]
r_version = "4.6.1"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/offset_ergm.R"
date = "2026-10-02"
model_a = "faux.mesa.high ~ edges + nodematch(\"Grade\") + offset(nodemix(\"Grade\", levels2=c(2,4))), offset.coef=c(-Inf,-Inf) -- ergm() (logistic regression: MPLE = MLE)"
model_b = "faux.mesa.high ~ offset(edges) + nodematch(\"Grade\"), offset.coef=-5"
model_c = "flomarriage ~ offset(edges) + gwesp(0.5, fixed=TRUE), offset.coef=-1.7 -- MCMLE at ergm() defaults, eleven seeds"

[tolerance]
# (a), (b): dyad-independent -- the SAME logistic regression on both sides,
# solved to convergence (R IRLS ~1e-8, ERGM.jl Newton 1e-8). A failure is a
# bug; do not loosen. The offset coefficients are fixed (-Inf, -5) and the
# SEs of the offsets are 0 on both sides.
a_coefficients = 1e-6
a_std_errors = 1e-6
a_loglik = 1e-5
a_aic = 1e-5
a_bic = 1e-5
b_coefficients = 1e-6
b_loglik = 1e-5
b_aic = 1e-5
b_bic = 1e-5
# ... except (b)'s standard error AS SHIPPED: R's glm stops ~2e-6 short of the
# closed-form value (b_exact_*), which ERGM.jl reproduces to ~1e-16; the
# as-shipped number is compared at 1e-5 (a tolerance that measures R), the
# exact one at 1e-9 (the tolerance that measures Julia).
b_std_errors = 1e-5
b_exact_coefficient = 1e-9
b_exact_std_error = 1e-9
# (d): the same argument; R's glm slack shows in the SEs (2e-7), hence 1e-5.
d_coefficients = 1e-6
d_std_errors = 1e-5
d_loglik = 1e-5
d_aic = 1e-5
d_bic = 1e-5
#
# (c): one ERGM.jl MCMLE fit against R's eleven-seed mean, per coefficient:
# 4*sqrt(sd_R^2 + sd_R^2/11) floored at a tenth of R's standard error (the
# rule of mcmle_ergm.toml), emitted as c_coef_tolerance / c_se_tolerance.

