model_separated = "30-node undirected network, 12 ties between different groups (group = (A,B,C)[v mod 3]) ~ edges + nodematch(\"group\") -- ergm() with its default drop=TRUE; nodematch.group = 0 is at its smallest attainable value"
model_mixed_sign = "8-node undirected network, x = -4..3, tie iff x_i + x_j <= 0 ~ edges + nodecov(\"x\") -- ergm(estimate=\"MPLE\"); nodecov.x = -50 is at its smallest attainable value although its change statistic takes both signs"
model_combination_separated = "6-node undirected network, x = (1,2,1,2,3,-2), z = (-1,-2,3,0,-3,-1), tie iff (x_i + z_i) + (x_j + z_j) > 0 ~ edges + nodecov(\"x\") + nodecov(\"z\") -- ergm(estimate=\"MPLE\"); no single statistic is at its attainable boundary, but the design is separated by nodecov.x + nodecov.z"
model_samplike_gof = "samplike ~ edges (MPLE) -- gof(GOF = ~distance + idegree + odegree + esp) observed panels only"
model_new_terms_flo = "flomarriage ~ concurrent + gwnsp(0.5, fixed=TRUE) + gwnsp(0, fixed=TRUE) + degrange(2) + degrange(1, 3) + meandeg + density + triadcensus + transitiveties + cyclicalties -- summary() only"
model_new_terms_samplike = "samplike ~ gwnsp(0.5, fixed=TRUE) + dgwnsp(0.5, fixed=TRUE, type=ITP/OSP/ISP) + idegrange(2) + odegrange(1, 3) + meandeg + density + triadcensus(0:15) + sender + receiver + transitiveties + cyclicalties -- summary() only"
model_samplike_summary = "samplike ~ edges + mutual + ostar(2) + istar(2) + gwidegree(0.5, fixed=TRUE) + gwodegree(0.5, fixed=TRUE) + triangle + ttriple + gwesp(0.5, fixed=TRUE) + gwdsp(0.5, fixed=TRUE) + dgwesp(0.5, fixed=TRUE, type=ITP/OSP/ISP) + dgwdsp(0.5, fixed=TRUE, type=ITP/OSP/ISP) -- summary() only; the directed gwesp/gwdsp labels carry the type"

[tolerance]
# Summary statistics are a DETERMINISTIC function of the observed graph --
# no estimator, no simulation. Machine precision; any disagreement is a bug
# in a term formula (or in the Degree(0:2) expansion), full stop.
flo_summary = 1e-9
samplike_summary = 1e-9
#
# MPLE vs MPLE. edges + degree(0:2) is dyad-DEPENDENT, so this is not an
# MLE comparison and says nothing about the MLE -- but the pseudo-likelihood
# is the SAME strictly-concave logistic-regression objective on both sides
# (R: glm on the change statistics via estimate="MPLE"; ERGM.jl: Newton on
# the compressed change-statistic design), and both solve it to convergence.
# The only difference two correct implementations can have is optimizer
# termination (R's IRLS ~1e-8, ERGM.jl's Newton 1e-8). 1e-6 is well inside
# both and ~1e-6 of the smallest standard error. A failure is a BUG in the
# design (the Degree(0:2) expansion, the change statistics) -- do not loosen.
flo_mple_coefficients = 1e-6
flo_mple_std_errors = 1e-6
#
# Drop semantics (separated nodematch): the finite coefficient is the exact
# logistic regression on the 300 dyads the dropped term does not touch and
# the dropped one is -Inf on both sides (isapprox(-Inf, -Inf) holds), so
# the optimizer-precision argument above applies unchanged. logLik, AIC and
# BIC follow from them in closed form; 1e-5 covers the rounding of a sum of
# 300 log-probabilities. df and nobs are integers, compared exactly.
sep_coefficients = 1e-6
sep_std_errors = 1e-6
sep_loglik = 1e-5
sep_aic = 1e-5
sep_bic = 1e-5
#
# The mixed-sign statistics and the gof observed panels are deterministic
# functions of the observed graph: machine precision.
mix_summary = 1e-9
sep2_summary = 1e-9
samplike_gof_distance = 1e-9
samplike_gof_idegree = 1e-9
samplike_gof_odegree = 1e-9
samplike_gof_esp = 1e-9
# (h) the 0.2 terms: summary() statistics, machine precision.
new_terms_flo_summary = 1e-9
new_terms_samplike_summary = 1e-9
# (i) esp/desp: summary() statistics, machine precision; the MPLE of
# edges + esp(0:1), pseudo-likelihood against pseudo-likelihood (as (c)).
esp_flo_summary = 1e-9
esp_samplike_summary = 1e-9
esp_mple_coefficients = 1e-6
esp_mple_std_errors = 1e-6

