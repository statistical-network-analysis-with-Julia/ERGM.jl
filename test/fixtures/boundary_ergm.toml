name = "boundary_ergm"

[provenance]
r_version = "4.6.1"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261007
script = "test/fixtures/r/boundary_ergm.R"
date = "2026-10-07"
model_a = "10-node perfect matching ~ edges + triangle -- estimate=\"MPLE\", and the default MLE under eleven seeds"
model_b = "10-node network, attribute a = p x5, q x4, r x1 ~ edges + nodemix(\"a\") -- ergm() (logistic regression)"
model_c = "two disjoint 4-cliques ~ edges + degree(1) -- estimate=\"MPLE\""
model_d = "flomarriage, z = 0 on every vertex ~ edges + nodecov(\"z\") -- ergm()"
model_e = "faux.mesa.high ~ edges + nodefactor(\"Grade\") + nodematch(\"Grade\", diff=TRUE) + nodefactor(\"Race\") + nodematch(\"Race\", diff=TRUE) + nodefactor(\"Sex\") + nodematch(\"Sex\") + gwesp(0.25, fixed=TRUE) + gwdegree(0.5, fixed=TRUE) -- estimate=\"MPLE\", and the default MLE under five seeds"

[tolerance]
# (a)-(e) MPLE: the SAME logistic regression on both sides (after the same
# drop), solved to convergence (R IRLS ~1e-8, ERGM.jl Newton 1e-8). A failure
# is a bug; do not loosen. -Inf must match exactly, and NA (nan) is compared
# as 'not estimated' (NaN on the Julia side) position by position.
a_mple_coefficients = 1e-6
a_mple_std_errors = 1e-5
b_mple_coefficients = 1e-6
b_mple_std_errors = 1e-5
c_mple_coefficients = 1e-6
c_mple_std_errors = 1e-5
d_mple_coefficients = 1e-6
d_mple_std_errors = 1e-5
e_mple_coefficients = 1e-6
# ... except (e)'s standard errors AS SHIPPED: R's glm at its default epsilon
# stops ~2e-4 short of the converged values (e_mple_std_errors_exact, glm at
# epsilon = 1e-14, which ERGM.jl reproduces); the as-shipped numbers are
# compared at 5e-4 (a tolerance that measures R), the exact ones at 1e-6.
e_mple_std_errors_as_shipped = 5e-4
e_mple_std_errors_exact = 1e-6
#
# (a), (e) MLE: one ERGM.jl MCMLE fit against R's seed mean, per coefficient:
# 4*sqrt(sd_R^2 + sd_R^2/k) floored at a tenth of R's standard error (the rule
# of mcmle_ergm.toml), emitted as a_mle_tolerance / e_mle_tolerance; the
# coefficients R fixes at -Inf must be -Inf (tolerance 0).

