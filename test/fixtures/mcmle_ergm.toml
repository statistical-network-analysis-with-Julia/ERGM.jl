name = "mcmle_ergm"

[provenance]
r_version = "4.6.1"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/mcmle_ergm.R"
date = "2026-10-02"
dataset = "ergm::faux.mesa.high (205 students, 203 undirected ties, Grade/Race/Sex) and ergm::flomarriage"
model_a = "faux.mesa.high ~ edges + nodematch(\"Grade\") + nodematch(\"Race\") + gwesp(0.25, fixed=TRUE)"
model_b = "model_a + gwdegree(0.5, fixed=TRUE)"
model_c = "flomarriage ~ edges + triangle"
control = "ergm() defaults: control.ergm(seed=s); (c) high precision: MCMC.samplesize=50000, MCMC.interval=2048, MCMLE.termination=\"precision\""
replication_seeds = "101,202,303,404,505,606,707,808,909,1010"

[tolerance]
# Deterministic functions of the observed graph: machine precision.
a_summary = 1e-9
b_summary = 1e-9
# The Florentine edges + triangle MPLE: the same convex logistic regression
# solved to convergence on both sides -- optimizer precision.
tri_mple = 1e-6
#
# (a)/(b) A SINGLE ERGM.jl MCMLE fit at its defaults is compared with R's
# eleven-seed mean. The difference has variance sd_J^2 + sd_R^2/11; ERGM.jl's
# own seed-to-seed sd (measured 0.0013-0.0061 on these models, 5 seeds) is
# of R's order, so sd_R stands in for both: the per-coefficient tolerance is
# 4*sqrt(sd_R^2 + sd_R^2/11) -- four standard deviations of the difference
# under the hypothesis that the two estimators agree -- floored at a tenth
# of R's standard error, the practical-equivalence margin of the flomarriage
# fixture (0.03 there, 8-11% of a standard error). The floor is needed: two
# MCMLE implementations with different MCMC designs (proposal, sample-size
# adaptation) carry different O(1/ESS) finite-sample biases, and R's seed sd
# on gwesp here (0.0015 over eleven fits) is below that. Measured before
# freezing: five default ERGM.jl fits of (a) sit 0.0016-0.0076 from R's mean
# on gwesp and 0.0014-0.010 on the other coefficients -- at most 7% of a
# standard error. Emitted per coefficient in [values] as a_coef_tolerance /
# b_coef_tolerance; the standard errors use the same rule on R's SE seed sd.
#
# (c) No ERGM.jl MCMLE fit may return tri_mple verbatim (the pre-0.2
# defect: the convergence test ran before the first step), and the mean of
# ten ERGM.jl fits must lie within 4 standard errors of the mean -- R's
# ten-seed sd over sqrt(10), the width of R's own default estimator -- of
# the high-precision MLE.
tri_mean_sd_multiple = 4
#
# (d) One ERGM.jl bridge estimate (16 Simpson rungs) at R's coefficients
# against R's 64-step mean: 4 x R's 16-step seed sd (the width of one
# default estimate). The quadrature bias of the pre-0.2 trapezoid (-0.3 to
# -0.5 here) is below that width; it is pinned exactly, on an enumerable
# network, by the ERGM.jl testset instead.
bridge_sd_multiple = 4

