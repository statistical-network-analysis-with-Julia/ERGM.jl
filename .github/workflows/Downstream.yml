# Generated by tools/sync_workflows.jl in the site repository
# (statistical-network-analysis-with-Julia.github.io); edit
# tools/workflows/Downstream.yml there. NetworkCore.jl and ERGM.jl carry it.
#
# A change to this package can break any package that depends on it, and their
# own CI runs only when they change (or nightly). After this package's CI passes
# on a push to `main`, re-run the CI workflow of every package in the
# organisation whose [sources] closure includes this one, wait for those runs,
# and report their results here, so one status says whether the new `main`
# broke a dependent.
#
# Dispatching and reading workflow runs in another repository needs a token
# with "Actions: read and write" on those repositories. Store it as the secret
# DOWNSTREAM_DISPATCH_TOKEN (see tools/CI.md in the site repository). Without
# it the job FAILS and its summary says "NOT DISPATCHED": a downstream check
# that did not run must not look like one that passed.
name: Downstream

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The dependents' full matrices run while this job waits for them.
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Minutes to wait for the dispatched runs before reporting them as unfinished
      WAIT_MINUTES: '320'
    steps:
      - name: Fail when the dispatch token is missing
        if: env.GH_TOKEN == ''
        run: |
          {
            echo "### Downstream CI: NOT DISPATCHED"
            echo
            echo "The DOWNSTREAM_DISPATCH_TOKEN secret is not set, so no dependent package was re-tested against this commit."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Downstream CI NOT DISPATCHED::Set the DOWNSTREAM_DISPATCH_TOKEN secret to re-test the dependents after each push."
          exit 1

      - uses: julia-actions/setup-julia@v3
        if: env.GH_TOKEN != ''
        with:
          version: '1'

      - name: Dispatch the CI of every dependent package
        if: env.GH_TOKEN != ''
        shell: julia --startup-file=no --color=yes {0}
        run: |
          using Dates, TOML
          org, repo = split(ENV["GITHUB_REPOSITORY"], '/')
          upstream = replace(repo, r"\.jl$" => "")
          gh(args...) = readchomp(`gh $args`)
          function raw(name, path)
              out = IOBuffer()
              ok = success(pipeline(`gh api -H "Accept: application/vnd.github.raw" repos/$org/$name/contents/$path`;
                                    stdout=out, stderr=devnull))
              return ok ? String(take!(out)) : nothing
          end
          # Who sources whom by path: `hard` follows [deps] only, `named` also
          # [weakdeps] and test-only [extras]. A package is re-tested when it
          # reaches this one through hard dependencies, or names this package
          # or one of those dependents in any of the three tables.
          repos = split(gh("repo", "list", org, "--no-archived", "--limit", "500",
                           "--json", "name", "--jq", ".[].name"), '\n'; keepempty=false)
          hard = Dict{String,Set{String}}()
          named = Dict{String,Set{String}}()
          for name in filter(endswith(".jl"), repos)
              text = raw(name, "Project.toml")
              text === nothing && continue
              meta = TOML.parse(text)
              local_sources = Set(dep for (dep, spec) in get(meta, "sources", Dict())
                                  if spec isa AbstractDict && haskey(spec, "path"))
              listed(tables...) = Set(dep * ".jl" for t in tables
                                      for dep in keys(get(meta, t, Dict())) if dep in local_sources)
              hard[name] = listed("deps")
              named[name] = listed("deps", "weakdeps", "extras")
          end
          reached = Set(["$upstream.jl"])
          frontier = ["$upstream.jl"]
          while !isempty(frontier)
              current = pop!(frontier)
              for (name, deps) in hard
                  current in deps && !(name in reached) || continue
                  push!(reached, name)
                  push!(frontier, name)
              end
          end
          dependents = Set(name for (name, deps) in named if !isempty(intersect(deps, reached)))
          delete!(dependents, "$upstream.jl")

          # Dispatch. A dependent that cannot be dispatched fails the job.
          status = Dict{String,String}()     # name => outcome line
          dispatched = Dict{String,DateTime}()
          for name in sort!(collect(dependents))
              ci = raw(name, ".github/workflows/CI.yml")
              if ci === nothing || !occursin("workflow_dispatch", ci)
                  println("::error title=$name not dispatched::its CI.yml has no workflow_dispatch trigger")
                  status[name] = "NOT DISPATCHED (CI.yml has no `workflow_dispatch`)"
                  continue
              end
              started = now(UTC) - Second(5)
              if success(`gh workflow run CI.yml --repo $org/$name --ref main`)
                  dispatched[name] = started
                  status[name] = "dispatched, no run found"
              else
                  println("::error title=$name not dispatched::gh workflow run failed")
                  status[name] = "NOT DISPATCHED (gh workflow run failed)"
              end
          end

          # Wait for each dispatched run and collect its conclusion.
          function find_run(name, after)
              rows = gh("run", "list", "--repo", "$org/$name", "--workflow", "CI.yml",
                        "--event", "workflow_dispatch", "--limit", "20", "--json",
                        "databaseId,createdAt,status,conclusion,url", "--jq",
                        ".[] | [.databaseId, .createdAt, .status, .conclusion, .url] | @tsv")
              best = nothing
              for line in split(rows, '\n'; keepempty=false)
                  id, created, state, conclusion, url = (split(line, '\t')..., "", "", "", "", "")[1:5]
                  DateTime(created[1:19]) >= after || continue
                  (best === nothing || created < best.created) &&
                      (best = (; id, created, state, conclusion, url))
              end
              return best
          end
          deadline = now(UTC) + Minute(parse(Int, ENV["WAIT_MINUTES"]))
          pending = Set(keys(dispatched))
          while !isempty(pending) && now(UTC) < deadline
              sleep(60)
              for name in sort!(collect(pending))
                  found = find_run(name, dispatched[name])
                  found === nothing && continue
                  if found.state == "completed"
                      status[name] = "$(found.conclusion) ($(found.url))"
                      delete!(pending, name)
                  else
                      status[name] = "unfinished: $(found.state) ($(found.url))"
                  end
              end
          end

          passed = [name for (name, line) in status if startswith(line, "success")]
          lines = ["| $name | $(status[name]) |" for name in sort!(collect(keys(status)))]
          verdict = isempty(status) ? "no dependents" :
                    length(passed) == length(status) ? "all $(length(passed)) dependents passed" :
                    "$(length(status) - length(passed)) of $(length(status)) dependents did not pass"
          report = "### Downstream CI after $upstream $(ENV["UPSTREAM_SHA"]): $verdict\n\n" *
                   "| package | CI result |\n|:---|:---|\n" * join(lines, '\n') * "\n"
          println(report)
          summary = get(ENV, "GITHUB_STEP_SUMMARY", "")
          isempty(summary) || open(io -> print(io, report), summary, "a")
          length(passed) == length(status) ||
              error("Downstream CI did not pass for: " *
                    join(sort!([n for n in keys(status) if !(n in passed)]), ", "))
