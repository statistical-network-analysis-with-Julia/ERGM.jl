name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - version: 'nightly'
            os: macos-latest
          - version: 'nightly'
            os: windows-latest
    steps:
      # The fifteen packages are independent repositories that find each other
      # through [sources] path dependencies (`Networks = {path = "../Networks.jl"}`).
      # A lone checkout has no siblings, so those paths dangle and Pkg fails to
      # resolve before a single test runs. Rebuild the layout every developer has
      # locally: this package in a directory named after it, siblings beside it.
      - uses: actions/checkout@v4
        with:
          path: ERGM.jl

      - name: Reconstruct the ecosystem layout
        shell: bash
        run: |
          org=https://github.com/statistical-network-analysis-with-Julia
          for pkg in Networks; do
            git clone --depth 1 --quiet "$org/$pkg.jl" "$pkg.jl"
          done

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      # Four threads on one cell: the thread-count-independence tests
      # (multi-chain `mcmle`/`sample_networks`/`gof` seeded from the caller's
      # rng) compare an in-process fit against a fresh process with a
      # different thread count, so at least one cell must not run on one.
      - name: Run tests
        shell: bash
        working-directory: ERGM.jl
        env:
          JULIA_NUM_THREADS: ${{ (matrix.version == '1' && matrix.os == 'ubuntu-latest') && '4' || '1' }}
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      # The allocation-regression gates (panel 2026-09, item 7): the
      # standalone benchmark environment must instantiate from the committed
      # metadata (`benchmark/Project.toml` [sources] point at `..` and the
      # sibling `../../Networks.jl` cloned above) and the per-toggle
      # change-statistic pins must hold. `Pkg.test()` guards the same pins
      # (testset "Hot paths are allocation-free"); this step proves the
      # benchmark harness the site's tools/run_benchmarks.jl consumes runs.
      - name: Allocation regression gates (benchmark environment)
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ERGM.jl
        env:
          JULIA_NUM_THREADS: 4
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: ERGM.jl/src

      - uses: codecov/codecov-action@v4
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
